# Timeline thumbnails for uosc. uosc talks to thumbfast over script messages and
# auto-detects it - no uosc config needed, this file only tunes thumbfast.
#
# thumbfast spawns a second, hidden mpv process to decode frames, so it is not
# free; quit_after_inactivity is what stops that process lingering all session.

# Thumbnail remote streams too, not just local files. Costs extra seeking and
# bandwidth - set to no if that ever becomes annoying on slow connections.
network=yes

# Start the thumbnailer at file load so the first hover is not blank.
spawn_first=yes

# Tear down the hidden mpv process after 5 idle minutes.
quit_after_inactivity=300

# thumbfast's own default is hwdec=no, so its subprocess software-decoded every
# thumbnail on two threads (--vd-lavc-threads=2 --vd-lavc-fast). That is what
# made previews crawl on HEVC. Uses the same VA-API path as playback.
hwdec=yes

# Tone mapping OFF, and this is not a preference - it is broken on this machine.
# For HDR/Dolby Vision sources thumbfast builds (thumbfast.lua:363):
#   zscale=transfer=linear,format=gbrpf32le,tonemap=X,zscale=transfer=bt709
# `zscale` comes from zimg, which this ffmpeg was NOT built against - confirmed
# with `mpv --vf=help` and `ffmpeg -filters`, neither lists it. The subprocess
# therefore exits non-zero ("mpv subprocess create failed" on the OSD), and
# thumbfast retries with tone mapping disabled - which is why thumbnails
# appeared at all. Setting it here skips the doomed first attempt.
#
# It was also the speed problem: that chain converts 4K frames to gbrpf32le
# (32-bit float per channel) and tonemaps in software on two threads.
#
# Installing the zimg package will NOT fix this - zscale is compiled into
# ffmpeg at build time, so it would need a rebuilt ffmpeg from xbps-src.
tone_mapping=no
