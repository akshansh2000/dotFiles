slang=en,eng
sub-scale=0.45
alang=spa,en,eng
save-position-on-quit

# --- uosc (~/.config/mpv/scripts/uosc) ---
# uosc draws its own controls, so mpv's built-in OSC and OSD bar have to be
# switched off or you get both stacked on top of each other. Its icon fonts
# live in ~/.config/mpv/fonts and mpv loads that directory automatically.
osc=no
osd-bar=no

# uosc renders window controls itself; without this you get mpv's title bar on
# top of uosc's. Comment out to go back to the system title bar.
border=no

# --- hardware decoding ---
# mpv's --hwdec default is `no`, i.e. everything decodes on the CPU. That is
# rough on Dolby Vision HEVC on this Cezanne iGPU. The VA-API stack is already
# installed (mesa-vaapi, radeonsi_drv_video.so), it just was not being used.
#
# auto-safe rather than plain auto: it only enables hwdec methods known to be
# reliable, and falls back to software per-codec instead of failing playback.
hwdec=auto-safe
