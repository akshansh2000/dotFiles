# Friendly name for the built-in speakers (2026-10-09). ALSA's own description
# is "Family 17h/19h HD Audio Controller Analog Stereo", which is what the rofi
# audio menu (waybar/scripts/audio-menu.sh), pwvucontrol and the volume tooltip
# showed. WirePlumber 0.5 conf syntax; restart the wireplumber service
# (~/.local/sv/wireplumber) to apply.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_04_00.6.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Laptop Speakers"
        node.nick        = "Laptop Speakers"
      }
    }
  }
]
