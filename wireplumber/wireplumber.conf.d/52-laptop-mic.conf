# Friendly name for the built-in microphone (2026-11-11), the counterpart of
# 51-laptop-speakers.conf. ALSA's own description is "Family 17h/19h HD Audio
# Controller Analog Stereo" (nick "ALC289 Analog"), which is what the Quickshell
# OSD's mic card, pwvucontrol and the rofi audio menu showed. WirePlumber 0.5
# conf syntax; restart the wireplumber service (~/.local/sv/wireplumber) to apply.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.pci-0000_04_00.6.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Laptop Microphone"
        node.nick        = "Laptop Microphone"
      }
    }
  }
]
