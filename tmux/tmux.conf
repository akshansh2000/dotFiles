# tmux - sessions that outlive the terminal, so agents (claudek, codex) and
# editors keep running when a foot window is closed.
#
# Built up lesson by lesson (2026-10); every line here fixes something that
# felt wrong in stock tmux. Reload after editing: prefix r.

# --- prefix: Ctrl-Space ---
# Ctrl-b is awkward to reach. Ctrl-Space is bound by nothing in fish, foot,
# Zed's terminal or Neovim (yet), so it costs no existing shortcut - unlike
# Ctrl-a, which would take fish's beginning-of-line.
# Pressing it twice sends a literal Ctrl-Space to the program inside, for the
# day something (say, a Neovim completion plugin) wants it.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- splits: \ side by side, - top/bottom ---
# Both unshifted, and shaped like the split they make (\ is a slanted |).
# New panes open in the current pane's directory instead of the directory
# the session started in, which is almost always what's wanted.
# '\' is quoted because a bare backslash is tmux's escape character.
# The stock % and " still work.
bind '\' split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"

# --- pane movement: h j k l ---
# Same keys as river (Super+hjkl) and, later, Neovim (Ctrl-w hjkl): one muscle
# memory at every layer. Not repeatable (-r) on purpose: with -r, an `h` typed
# into the shell right after a move would be swallowed as another move.
# This takes over prefix l, which was "last window" - that is still on
# prefix ; for the last pane, and prefix w lists windows.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- direct keys: Alt, no prefix ---
# The everyday actions in one keystroke. Each layer gets its own modifier on
# the same keys: Super+hjkl/1-9 is river, Alt+hjkl/1-9 is tmux. The prefix
# versions above stay as the fallback (and as the habit that works on any
# stock tmux).
#
# -n binds in the root table, so tmux takes these keys from EVERY pane and the
# program inside never sees them. Checked before choosing them:
#   - fish loses Alt-h (man page for the current command) and Alt-l (ls the
#     token under the cursor), inside tmux only - accepted.
#   - fzf's Alt-c, Claude Code's Alt-p/Alt-t, river (Super+Alt only): untouched.
#   - Neovim has no Alt defaults. Keep it that way: no Alt mappings in the
#     Neovim config, so a smart-splits-style plugin can later make Alt-hjkl
#     cross Neovim splits and tmux panes as one surface.
#   - Zed's terminal may take Alt-1..9 for its own tabs before tmux sees them
#     (unverified - matters only when tmux runs inside Zed).
# Alt arrives as ESC+key, so these rely on escape-time (below) being non-zero.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n 'M-\' split-window -h -c "#{pane_current_path}"
bind -n M--   split-window -v -c "#{pane_current_path}"
# Alt-N goes to window N, CREATING it (in the current pane's directory) if it
# does not exist yet - like river's tags, where Super+N always lands somewhere.
# Changed 2026-10-06 from "select only"; the cost is a stray empty window
# after a mistyped number (close it with `exit` or prefix &).
# The test is a tmux format, not a shell call, so it is instant and always
# looks at THIS session: #{W:...} loops over the session's windows and prints
# 1 for the one whose index is N, so an empty result means "no window N".
# The window is created AT index N, so Alt-5 with only window 1 open gives
# windows 1 and 5. renumber-windows closes such gaps only when a window is
# closed - and from then on the numbers shift down.
bind -n M-1 if -F "#{W:#{?#{==:#{window_index},1},1,}}" "select-window -t :=1" "new-window -t :=1 -c \"#{pane_current_path}\""
bind -n M-2 if -F "#{W:#{?#{==:#{window_index},2},1,}}" "select-window -t :=2" "new-window -t :=2 -c \"#{pane_current_path}\""
bind -n M-3 if -F "#{W:#{?#{==:#{window_index},3},1,}}" "select-window -t :=3" "new-window -t :=3 -c \"#{pane_current_path}\""
bind -n M-4 if -F "#{W:#{?#{==:#{window_index},4},1,}}" "select-window -t :=4" "new-window -t :=4 -c \"#{pane_current_path}\""
bind -n M-5 if -F "#{W:#{?#{==:#{window_index},5},1,}}" "select-window -t :=5" "new-window -t :=5 -c \"#{pane_current_path}\""
bind -n M-6 if -F "#{W:#{?#{==:#{window_index},6},1,}}" "select-window -t :=6" "new-window -t :=6 -c \"#{pane_current_path}\""
bind -n M-7 if -F "#{W:#{?#{==:#{window_index},7},1,}}" "select-window -t :=7" "new-window -t :=7 -c \"#{pane_current_path}\""
bind -n M-8 if -F "#{W:#{?#{==:#{window_index},8},1,}}" "select-window -t :=8" "new-window -t :=8 -c \"#{pane_current_path}\""
bind -n M-9 if -F "#{W:#{?#{==:#{window_index},9},1,}}" "select-window -t :=9" "new-window -t :=9 -c \"#{pane_current_path}\""

# --- numbering: windows and panes from 1 ---
# 0 sits at the far end of the number row, away from 1. renumber-windows closes
# the gap when a window goes away, so prefix 1..9 always matches what the
# status bar shows.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- mouse ---
# Click to focus a pane or window, drag borders to resize, wheel to scroll
# (scrolling enters copy mode). Hold Shift to bypass tmux and use foot's own
# selection when a plain terminal-style copy is wanted.
set -g mouse on

# --- reload ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- plumbing (invisible until it is missing) ---
# Esc reaches the program after this many ms. The default 500 makes every Esc
# in Neovim lag by half a second; tmux waits that long to see whether Esc
# starts an Alt-key sequence.
set -sg escape-time 10

# Terminal type inside tmux. tmux-256color supports italics and strikethrough;
# its terminfo comes from the ncurses-term package (installed 2026-10-06). The
# screen-256color fallback (always present, no italics) only matters if that
# package ever goes away - a TERM with no terminfo entry would break `clear`,
# Neovim and friends.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal tmux-256color' \
    'set -g default-terminal screen-256color'
# foot does 24-bit colour; tell tmux so Catppuccin colours pass through exactly
# instead of being rounded to the nearest of 256.
set -as terminal-features ',foot*:RGB'

# Let programs inside set the system clipboard through foot (OSC 52) - this is
# how copy-mode yanks and Neovim's clipboard reach Wayland from inside tmux.
set -s set-clipboard on

# Pass focus in/out to programs, so Neovim notices files an agent changed
# while the pane was in the background.
set -g focus-events on

# Agent sessions print a lot; the default 2000 lines of scrollback is short.
set -g history-limit 50000

# Pass modified keys through intact. Without this tmux flattens Shift+Enter,
# Ctrl+Enter and friends into their plain form, so Shift+Enter in Claude Code
# (new line) sends the message instead. `on` (not `always`) only sends the
# extended encoding to programs that ask for it, so older programs never see
# sequences they can't parse. foot supports it (client reports `extkeys`).
# Programs ask at startup: restart a running Claude/Codex to pick it up.
set -s extended-keys on

# A session started before a re-login keeps the old login's environment. These
# are re-read from the attaching client on every attach, so NEW panes and
# windows get the current Wayland socket and D-Bus bus (clipboard,
# notify-send, xdg-open keep working). Shells already running keep what they
# had - restart those if they misbehave after a re-login.
set -ga update-environment WAYLAND_DISPLAY
set -ga update-environment DBUS_SESSION_BUS_ADDRESS
set -ga update-environment XDG_RUNTIME_DIR

# --- links (2026-10-17) ---
# foot can't open a link on click, and inside tmux its URL mode (Ctrl+Shift+O)
# only sees tmux's screen, so tmux handles links itself, via urls.sh:
#   Ctrl+click   open the link under the mouse: an OSC 8 hyperlink (ls
#                --hyperlink, gh, Claude Code) or a plain-text URL
#   prefix u     every URL in the pane's scrollback in an fzf popup, newest
#                first - Enter opens, Ctrl+Y copies, Tab marks several
# Ctrl+click is taken from the program in the pane, which almost never uses it.
bind -n C-MouseDown1Pane run-shell -b "~/.config/tmux/urls.sh click #{mouse_x} x#{q:mouse_hyperlink} x#{q:mouse_line}"
bind u display-popup -E -w 80% -h 60% -T ' urls ' "~/.config/tmux/urls.sh pick"
# Let OSC 8 hyperlinks through to foot (and keep them, for Ctrl+click above).
set -as terminal-features ',foot*:hyperlinks'
set -as terminal-features ',xterm-kitty:hyperlinks'
