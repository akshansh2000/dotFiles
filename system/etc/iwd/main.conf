# Staged copy of /etc/iwd/main.conf - the repo copy is the source; edit here,
# then install with (shows the diff, asks, sudo-installs):
#   ~/.config/system/install.sh etc/iwd/main.conf
#   sudo sv restart iwd
#
# Country=IN is why this file is tracked. Without the wireless-regdb package
# cfg80211 logs "failed to load regulatory.db" and falls back to the built-in
# world domain, where `iw reg get` reports:
#
#     country 00: DFS-UNSET
#       (5170 - 5250 @ 80), (6, 20), (N/A),   AUTO-BW, PASSIVE-SCAN
#       (5250 - 5330 @ 80), (6, 20), (0 ms),  DFS, AUTO-BW, PASSIVE-SCAN
#       (5490 - 5730 @ 160), (6, 20), (0 ms), DFS, PASSIVE-SCAN
#       (5735 - 5835 @ 80), (6, 20), (N/A),   PASSIVE-SCAN
#
# i.e. every 5GHz band is passive-scan-only, so the card cannot send probe
# requests and has to wait to overhear a beacon on each channel. The home AP is
# 5GHz, so on a cold boot the first scan pass routinely missed it and iwd sat in
# autoconnect_full for ~12s waiting to rescan - that was the whole of the
# "wifi takes ages after startup" problem. Association itself took 200ms and
# DHCP 1.6s; neither was ever the issue.
#
# Requires the wireless-regdb package (provides /lib/firmware/regulatory.db).
# The Country= line alone does nothing without it. Per iwd.config(5) this is
# only a *hint* to the kernel, and impossible on a self-managed wiphy - this
# card is not one (`iw phy` shows no self-managed flag and `iw reg get` has no
# per-phy section), so it is honoured here.
#
# Set this to wherever the machine physically is; it is a regulatory limit, not
# a preference. IN matches the AP's SSID and the ISP's IPv6 allocation.

[General]
EnableNetworkConfiguration=true
Country=IN

[Network]
NameResolvingService=resolvconf
