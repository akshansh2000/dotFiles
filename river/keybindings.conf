# river global keybindings - MASTER FILE
#
# Edit this file, then run:  ~/.config/river/gen-keybindings.sh --apply
# It regenerates the marked block inside ~/.config/river/init. Never edit
# that block directly; it gets overwritten.
#
# Columns are pipe-separated. Alignment is free-form (fields are trimmed),
# so keep them lined up however reads best.
#
#   map     | modes | mods | key    | action     ->  riverctl map ...
#   pointer | modes | mods | button | action     ->  riverctl map-pointer ...
#   raw     | <shell line>                       ->  copied out verbatim
#
#   modes   comma-list, e.g. `normal` or `normal,locked`. One riverctl call
#           is emitted per mode.
#   mods    `Super`, `Super+Shift`, `None`, ... passed through as typed.
#
# Line prefixes:
#   ## Text     section header -> emitted as `# --- Text ---`
#   #> Text     note           -> emitted as `# Text`
#   #  Text     private note   -> dropped (like this header block)
#
# QUOTING - the one rule worth knowing:
#   `spawn` actions are auto-wrapped in single quotes, so write the command
#   here exactly as you would type it in a shell, unquoted. $(...) inside it
#   is deferred to spawn time, not expanded when generating.
#   Every other action is emitted VERBATIM, so quote it yourself when it
#   needs to stay one argument (see send-layout-cmd below).

## Core: terminal, close, session menu
# Super+Shift+Q was a bare `exit` until 2026-10-10; it now opens the rofi
# session menu (screen off / suspend / log out / restart / shut down), whose
# "Log out" is that same `riverctl exit`, behind a yes/no.
map       | normal        | Super              | Return    | spawn foot ~/.config/river/term.sh tmux
# kitty on trial next to foot (2026-10-17); no term.sh needed - kitty sizes
# the pty before starting tmux, so there is no resize flash to hide. The cache
# prefix and -1 (single instance) take it from ~1.1 s to ~30 ms - see the
# startup-speed note in kitty/kitty.conf.tmpl. One kitty process serves every
# window, which is fine here: tmux sessions outlive a kitty crash. The inner
# `env -u` keeps the variable away from tmux and everything under it: a window
# opened through a running kitty gets the launcher's environment, so
# kitty.conf's `env` line alone doesn't reach it (tested 2026-10-17).
map       | normal        | Super+Shift        | Return    | spawn env PYTHONPYCACHEPREFIX=$HOME/.cache/kitty-pycache kitty -1 env -u PYTHONPYCACHEPREFIX tmux
map       | normal        | Super              | Q         | close
map       | normal        | Super+Shift        | Q         | spawn ~/.config/river/session-menu.sh

## file manager, browser, pwvucontrol
map       | normal        | Super              | E         | spawn pcmanfm
map       | normal        | Super+Control      | E         | spawn foot yazi
map       | normal        | Super              | B         | spawn ~/.local/bin/zen
map       | normal        | Super+Shift        | B         | spawn firefox -P krypton
map       | normal        | Super              | A         | spawn pwvucontrol

## rofi
map       | normal        | Super              | p         | spawn rofi -show drun
map       | normal        | Super+Shift        | P         | spawn ~/.config/path/path-menu.sh

#> Clipboard history. cliphist stores entries via the wl-paste watchers
#> supervised in ~/.local/sv/cliphist-{text,image}; this only reads them back.
#> `cliphist decode` is needed because list output is id-prefixed and images
#> are stored as references, not literal data.
map       | normal        | Super              | V         | spawn sh -c 'cliphist list | rofi -dmenu -p clipboard | cliphist decode | wl-copy'

## Focus / swap / zoom
# Through focus-view.sh: out of fullscreen first, since river ignores
# focus-view while the focused window is fullscreen (2026-10-30).
map       | normal        | Super              | J         | spawn ~/.config/river/focus-view.sh next
map       | normal        | Super              | K         | spawn ~/.config/river/focus-view.sh previous
map       | normal        | Super+Shift        | J         | swap next
map       | normal        | Super+Shift        | K         | swap previous
# disabled: map | normal | Super | Return | zoom   (Super+Return is the terminal)

## Layout (wideriver)
#> Layout, previous layout and stack mode are all tracked PER TAG, in memory -
#> a wideriver or river restart puts every tag back to left/dwindle.
#> --ratio and --count act on whatever layout the tag is in: in wide they set
#> the wide ratio and how many windows go to the left-hand stack.
map       | normal        | Super              | H         | send-layout-cmd wideriver "--ratio -0.05"
map       | normal        | Super              | L         | send-layout-cmd wideriver "--ratio +0.05"
map       | normal        | Super+Shift        | H         | send-layout-cmd wideriver "--count +1"
map       | normal        | Super+Shift        | L         | send-layout-cmd wideriver "--count -1"
map       | normal        | Super              | Up        | send-layout-cmd wideriver "--layout top"
map       | normal        | Super              | Right     | send-layout-cmd wideriver "--layout right"
map       | normal        | Super              | Down      | send-layout-cmd wideriver "--layout bottom"
map       | normal        | Super              | Left      | send-layout-cmd wideriver "--layout left"
#> S/M/W jump straight to stack (= left, same as Super+Left), monocle and wide.
#> Super+S sits next to Super+Shift+S (screenshot): a missed Shift opens nothing
#> worse than a layout change.
map       | normal        | Super              | S         | send-layout-cmd wideriver "--layout left"
map       | normal        | Super              | M         | send-layout-cmd wideriver "--layout monocle"
map       | normal        | Super              | W         | send-layout-cmd wideriver "--layout wide"
#> Super+T swaps the current and previous layout - "the last two", not a fixed
#> pair. On a fresh tag the previous is seeded to monocle (--layout-alt), so it
#> starts as left <-> monocle. Setting a layout the tag is already in does not
#> touch "previous", so Super+M in monocle followed by Super+T still goes back.
map       | normal        | Super              | T         | send-layout-cmd wideriver "--layout-toggle"

